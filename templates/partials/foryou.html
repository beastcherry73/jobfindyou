<!--
  For You - the resume-matched shortlist.

  PLACEHOLDER IN THIS PASS, deliberately. The scoring engine already exists in
  backend/services/digest.py (keyword index + rank, then AI scoring on the
  survivors only) and has been verified against production Postgres, but wiring
  it to a route and rendering real recommendations is its own stage.

  What ships here is the shell slot: the tab exists, is reachable, and states
  honestly that it is not live yet. It does NOT fake a shortlist -- an empty
  promise is worse than an absent one, and a fabricated match score would be
  indistinguishable from a broken one.
-->
<div class="ws-page-header">
  <div>
    <h1 class="ws-page-title">For you</h1>
    <p class="ws-page-subtitle">
      A short, ranked shortlist matched to your resume — instead of a search box.
    </p>
  </div>
</div>

<div class="ws-card" style="padding:48px 24px;text-align:center;">
  <div style="width:44px;height:44px;border-radius:12px;background:var(--ws-primary-subtle);
              display:grid;place-items:center;margin:0 auto 16px;">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--ws-primary)"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l2.4 5.4 5.6.6-4.2 3.9 1.2 5.6L12 15.8 6.9 18.5l1.2-5.6L4 9l5.6-.6z"/>
    </svg>
  </div>
  <h2 style="font-size:16px;font-weight:600;margin-bottom:6px;">Not switched on yet</h2>
  <p style="font-size:13px;color:var(--ws-text-secondary);max-width:420px;margin:0 auto 18px;line-height:1.6;">
    The matching engine is built and tested, but it isn't wired up to real
    recommendations yet. Until it is, this tab stays empty rather than showing
    you a shortlist we can't stand behind.
  </p>
  <button class="ws-btn ws-btn-primary" onclick="switchSection('jobsearch')">
    Browse jobs instead
  </button>
</div>

<script>
  // Nothing to load yet. Defined so switchSection('foryou') has the same shape
  // as the other sections and does not need a special case later.
  window.initForYou = function () {};
</script>
