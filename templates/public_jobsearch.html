<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Jobs — JobSpike</title>
  <meta name="description" content="Search fresh roles pulled straight from employers' own career sites. Free, no account needed to search.">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/static/css/workspace.css">
  <link rel="icon" type="image/svg+xml" href="/static/img/jobspike-icon.svg">
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
  <style>
    /* Public job search overrides - minimal layout without sidebar */
    :root {
      --ws-bg: #F8F6F1;
      --ws-surface: #FFFFFF;
      --ws-surface-hover: #F5F3EF;
      --ws-elevated: #FFFFFF;
      --ws-border: #E8E4DE;
      --ws-border-light: #F0EDE8;
      --ws-text: #1A1A2E;
      --ws-text-secondary: #6B7280;
      --ws-text-tertiary: #9CA3AF;
      --ws-primary: #1E3A5F;
      --ws-primary-hover: #152B47;
      --ws-primary-subtle: #E8EEF5;
      --ws-good: #16A34A;
      --ws-good-bg: #F0FDF4;
      --ws-warn: #D97706;
      --ws-warn-bg: #FFFBEB;
      --ws-bad: #DC2626;
      --ws-bad-bg: #FEF2F2;
      --ws-shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --ws-shadow-md: 0 4px 12px rgba(0,0,0,0.06);
      --ws-shadow-lg: 0 12px 24px rgba(0,0,0,0.08);
      --ws-radius-sm: 6px;
      --ws-radius-md: 10px;
      --ws-radius-lg: 14px;
      --ws-radius-full: 999px;
      --ws-duration: 150ms;
      --ws-ease: cubic-bezier(0.4, 0, 0.2, 1);
      --ws-font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --ws-font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ws-bg: #141310;
        --ws-surface: #1B1A16;
        --ws-surface-hover: #22211D;
        --ws-elevated: #1B1A16;
        --ws-border: #2B2925;
        --ws-border-light: #33312C;
        --ws-text: #ECEAE4;
        --ws-text-secondary: #9CA3AF;
        --ws-text-tertiary: #6B7280;
        --ws-primary: #5680F2;
        --ws-primary-hover: #7A9CF5;
        --ws-primary-subtle: rgba(86, 128, 242, 0.15);
        --ws-good: #22C55E;
        --ws-good-bg: rgba(34, 197, 94, 0.15);
        --ws-warn: #F59E0B;
        --ws-warn-bg: rgba(245, 158, 11, 0.15);
        --ws-bad: #EF4444;
        --ws-bad-bg: rgba(239, 68, 68, 0.15);
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--ws-bg); color: var(--ws-text); font-family: var(--ws-font-sans); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; min-height: 100vh; }
    a { color: var(--ws-primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .public-header { border-bottom: 1px solid var(--ws-border); background: var(--ws-surface); position: sticky; top: 0; z-index: 100; }
    .public-header .wrap { max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 64px; }
    .public-header .brand { display: flex; align-items: center; gap: 10px; font-size: 1.15rem; font-weight: 700; color: var(--ws-text); }
    .public-header .brand-mark { width: 28px; height: 28px; background: var(--ws-primary); border-radius: 8px; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 800; }
    .public-header .cta { display: inline-flex; align-items: center; gap: 8px; background: var(--ws-primary); color: #fff; padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; }
    .public-header .cta:hover { background: var(--ws-primary-hover); text-decoration: none; }
    main { padding: 24px 24px 48px; }
    .wrap { max-width: 1280px; margin: 0 auto; }
    .page-header { margin-bottom: 24px; }
    .page-title { font-size: 28px; font-weight: 700; line-height: 1.2; margin: 0 0 6px; letter-spacing: -0.02em; }
    .page-subtitle { font-size: 15px; color: var(--ws-text-secondary); margin: 0; }
    .ws-card { background: var(--ws-surface); border: 1px solid var(--ws-border); border-radius: var(--ws-radius-lg); }
    .ws-card-body { padding: 20px; }
    .ws-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; font-size: 13.5px; font-weight: 600; border-radius: var(--ws-radius-md); padding: 10px 16px; border: 1px solid transparent; cursor: pointer; transition: all var(--ws-duration) var(--ws-ease); text-decoration: none; white-space: nowrap; }
    .ws-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .ws-btn-primary { background: var(--ws-primary); color: #fff; border-color: var(--ws-primary); }
    .ws-btn-primary:hover:not(:disabled) { background: var(--ws-primary-hover); border-color: var(--ws-primary-hover); }
    .ws-btn-secondary { background: var(--ws-surface); color: var(--ws-text); border-color: var(--ws-border); }
    .ws-btn-secondary:hover:not(:disabled) { background: var(--ws-surface-hover); border-color: var(--ws-text-tertiary); }
    .ws-btn-ghost { background: transparent; color: var(--ws-text-secondary); border-color: transparent; }
    .ws-btn-ghost:hover:not(:disabled) { background: var(--ws-surface-hover); color: var(--ws-text); }
    .ws-btn-sm { padding: 7px 12px; font-size: 12.5px; }
    .ws-input, .ws-select { width: 100%; padding: 10px 12px; font-family: inherit; font-size: 13.5px; border: 1px solid var(--ws-border); border-radius: var(--ws-radius-md); background: var(--ws-surface); color: var(--ws-text); transition: border-color var(--ws-duration) var(--ws-ease), box-shadow var(--ws-duration) var(--ws-ease); }
    .ws-input:focus, .ws-select:focus { outline: none; border-color: var(--ws-primary); box-shadow: 0 0 0 3px var(--ws-primary-subtle); }
    .ws-input::placeholder { color: var(--ws-text-tertiary); }
    .ws-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .ws-badge { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: var(--ws-radius-full); }
    .ws-badge-good { background: var(--ws-good-bg); color: var(--ws-good); }
    .ws-badge-warn { background: var(--ws-warn-bg); color: var(--ws-warn); }
    .ws-badge-bad { background: var(--ws-bad-bg); color: var(--ws-bad); }
    footer.site { border-top: 1px solid var(--ws-border); padding: 22px 0 40px; font-size: 13px; color: var(--ws-text-tertiary); margin-top: 48px; }
    footer.site .wrap { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    footer.site a { color: var(--ws-text-tertiary); margin-right: 16px; }
    footer.site a:hover { color: var(--ws-primary); }
    @media (max-width: 640px) {
      .public-header .wrap { padding: 0 16px; }
      main { padding: 16px 16px 40px; }
      .page-title { font-size: 22px; }
      .page-subtitle { font-size: 14px; }
      .public-header .cta { padding: 8px 12px; font-size: 13px; }
    }
    /* Toast (minimal) */
    .ws-toast { position: fixed; bottom: 24px; right: 24px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .ws-toast-item { background: var(--ws-surface); border: 1px solid var(--ws-border); border-radius: var(--ws-radius-lg); padding: 12px 16px; box-shadow: var(--ws-shadow-lg); max-width: 360px; pointer-events: auto; animation: ws-toast-in 0.2s var(--ws-ease); }
    .ws-toast-item.info { border-left: 3px solid var(--ws-primary); }
    .ws-toast-item.success { border-left: 3px solid var(--ws-good); }
    .ws-toast-item.error { border-left: 3px solid var(--ws-bad); }
    .ws-toast-item.warning { border-left: 3px solid var(--ws-warn); }
    @keyframes ws-toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 480px) { .ws-toast { left: 12px; right: 12px; bottom: 12px; } .ws-toast-item { max-width: none; } }
  </style>
</head>
<body>
  <header class="public-header">
    <div class="wrap">
      <a href="/" class="brand" aria-label="JobSpike home">
        <span class="brand-mark">J</span>
        <span>JobSpike</span>
      </a>
      <a href="/app/jobs" class="cta">Sign in to save & track</a>
    </div>
  </header>

  <main>
    <div class="wrap">
      {% include "partials/jobsearch.html" %}
    </div>
  </main>

  <footer class="site">
    <div class="wrap">
      <a href="/">Home</a>
      <a href="/guides">Guides</a>
      <a href="/compare/resumax">JobSpike vs ResuMax</a>
      <div style="margin-top:10px;">© 2026 JobSpike</div>
    </div>
  </footer>

  <div class="ws-toast" id="wsToast"></div>

  <script>
    // Minimal workspace shell shims for jobsearch partial
    window.showToast = function(msg, type) {
      type = type || 'info';
      var container = document.getElementById('wsToast');
      var el = document.createElement('div');
      el.className = 'ws-toast-item ' + type;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(function() { el.remove(); }, 4000);
    };

    // switchSection stub - for "Tailor for this" which tries to switch to analysis-upload
    window.switchSection = function(section) {
      if (section === 'analysis-upload') {
        window.location.href = '/app/analyze';
      }
    };

    // Initialize job search on load
    document.addEventListener('DOMContentLoaded', function() {
      if (window.initJobSearch) {
        window.initJobSearch();
      }
    });
  </script>
</body>
</html>
